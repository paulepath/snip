<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Lower-Left Facet: Editor Markup Layer -->
  <path d="M 10 24 L 10 44 C 10 49.5 14.5 54 20 54 L 40 54 L 42.5 51.5 L 12.5 21.5 Z"
        fill="#EEF1F4" stroke="#B0B8C4" stroke-width="2" stroke-linejoin="round"/>
        
  <!-- Upper-Right Facet: Frozen Capture Layer (offset up-right) -->
  <path d="M 24 10 L 44 10 C 49.5 10 54 14.5 54 20 L 54 40 L 51.5 42.5 L 21.5 12.5 Z"
        fill="#DDF4FF" stroke="#0969DA" stroke-width="2" stroke-linejoin="round"/>
        
  <!-- Crop Viewfinder bracket in Capture Tile -->
  <path d="M 40 15 H 48 C 49.2 15 50 15.8 50 17 V 25"
        fill="none" stroke="#0969DA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Focus cross in Capture Tile -->
  <circle cx="43" cy="22" r="1.5" fill="#0969DA"/>
  
  <!-- Editor Step Badge in Markup Tile: ① (Numbered Step Badge) -->
  <circle cx="23" cy="41" r="7" fill="#1A7F37"/>
  <!-- Digit '1' inside badge -->
  <path d="M 21.6 38.0 L 23.4 36.6 L 24.6 36.6 L 24.6 45.0 L 23.0 45.0 L 23.0 39.1 L 21.8 39.9 Z" fill="#FFFFFF"/>
  
  <!-- Red Annotation Pointer linking the facets -->
  <g>
    <!-- Arrow shaft -->
    <line x1="38" y1="26" x2="31" y2="33" stroke="#DC2626" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Arrow tip pointing to step -->
    <polygon points="27.5,36.5 35.5,35 33,31" fill="#DC2626"/>
  </g>
</svg>
