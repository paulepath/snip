<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Top Viewfinder Loop: sweeps top-right around to waist -->
  <path d="M 48 14 H 25 C 17.5 14 12 19.5 12 26.5 C 12 33 17 37 24 37 H 37"
        fill="none" stroke="#0969DA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Bottom Viewfinder Loop: sweeps bottom-left around to waist -->
  <path d="M 16 50 H 39 C 46.5 50 52 44.5 52 37.5 C 52 31 47 27 40 27 H 27"
        fill="none" stroke="#054DA7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Central Aperture Focal Reticle -->
  <g>
    <!-- Red aperture core -->
    <circle cx="32" cy="32" r="4.8" fill="#DC2626"/>
    <circle cx="32" cy="32" r="1.8" fill="#FFFFFF"/>
    <!-- Viewfinder tick lines -->
    <line x1="32" y1="21.5" x2="32" y2="23.5" stroke="#0969DA" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="40.5" x2="32" y2="42.5" stroke="#054DA7" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
